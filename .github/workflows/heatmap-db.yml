name: Heatmap DB

# Heatmap aggregation runs in the database (#26). This checks it on real engines: the golden test
# on Postgres, MySQL and MongoDB, and the 1 M-event Postgres bench (p95 <= 500 ms, flat RSS).
on:
  # No trigger-level `paths`: a skipped workflow never reports, so it cannot be a required check and
  # misses changes outside the old list (#95). The `changes` job decides; `golden-status` always reports.
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect heatmap-db changes
    runs-on: ubuntu-24.04
    # Only pull_request has a base to diff against; schedule/dispatch always run Golden.
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      golden: ${{ steps.filter.outputs.golden }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            golden:
              - "packages/heat-collector/src/**"
              - "packages/heat-collector/package.json"
              - "packages/heat-collector/bench/**"
              - "packages/heat-collector/vitest.config.ts"
              - "packages/heat-collector/tsconfig*.json"
              - "packages/heat-errors/**"
              - "tsconfig.base.json"
              - "package.json"
              - "pnpm-workspace.yaml"
              - "fixtures/**"
              - "pnpm-lock.yaml"
              - ".github/workflows/heatmap-db.yml"

  heatmap-db:
    name: Golden (pg, mysql, mongo) + bench (pg)
    needs: changes
    # always() so a skipped `changes` (non-PR events) does not skip Golden; a failed `changes` on a PR
    # skips Golden here and golden-status turns that into a failure.
    if: >-
      always() && (github.event_name != 'pull_request' ||
      (needs.changes.result == 'success' && needs.changes.outputs.golden == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heat
          POSTGRES_PASSWORD: heat
          POSTGRES_DB: heat_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heat" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: heat_tracker
          MYSQL_USER: heat
          MYSQL_PASSWORD: heat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-timeout 5s
          --health-retries 30
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'" --health-interval 5s --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Golden test on Postgres, MySQL and MongoDB
        run: pnpm -C packages/heat-collector test:golden
        env:
          HEAT_TEST_PG_URL: postgres://heat:heat@127.0.0.1:5432/heat_tracker
          HEAT_TEST_MYSQL_URL: mysql://heat:heat@127.0.0.1:3306/heat_tracker
          HEAT_TEST_MONGO_URL: mongodb://127.0.0.1:27017/

      - name: Build collector
        run: pnpm -C packages/heat-errors build && pnpm -C packages/heat-collector build

      - name: Bench 1 M events on Postgres
        run: pnpm -C packages/heat-collector bench:heatmap
        env:
          DATABASE_URL: postgres://heat:heat@127.0.0.1:5432/heat_tracker

  golden-status:
    name: golden-status
    needs: [changes, heatmap-db]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Golden result
        env:
          CHANGES: ${{ needs.changes.result }}
          GOLDEN: ${{ needs.heatmap-db.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "event=$EVENT changes=$CHANGES heatmap-db=$GOLDEN"
          if [ "$EVENT" != "pull_request" ]; then
            [ "$GOLDEN" = "success" ] && exit 0
            echo "::error::Golden $GOLDEN on $EVENT"; exit 1
          fi
          if [ "$CHANGES" != "success" ]; then echo "::error::changes job $CHANGES"; exit 1; fi
          case "$GOLDEN" in
            success|skipped) exit 0 ;;
            *) echo "::error::Golden $GOLDEN"; exit 1 ;;
          esac
